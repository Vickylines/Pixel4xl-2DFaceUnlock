name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and lint
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:lintRelease :app:assembleDebugAndroidTest --no-daemon

      - name: Build standalone validation app and device tests
        run: ./gradlew :app:assembleValidation :app:assembleValidationAndroidTest -Pvalidation --no-daemon

      - name: Upload CI APK (CI certificate, use GitHub Release for upgrades)
        uses: actions/upload-artifact@v4
        with:
          name: Pixel2DFaceUnlock-ci-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel2DFaceUnlock-validation
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-release.*
          if-no-files-found: warn
